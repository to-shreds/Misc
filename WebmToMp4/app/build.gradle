plugins { id 'com.android.application' }
android {
    namespace 'com.toshreds.webmtomp4'
    compileSdk 35
    defaultConfig {
        applicationId 'com.toshreds.webmtomp4'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'
        testInstrumentationRunner 'com.toshreds.webmtomp4.ConversionSmokeRunner'
    }
    buildTypes {
        release { minifyEnabled false }
        debug { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        jniLibs { useLegacyPackaging = true }
    }
}
dependencies {
    // 7.1.6 min-gpl crashes during dlopen due to ELF RELRO/16KB alignment.
    // 8.1.9 uses fixed NDK r27c toolchain; includes H.264 libx264.
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-min-gpl:8.1.9'
}
