plugins { id 'com.android.application' }
android {
    namespace 'com.toshreds.webmtomp4'
    compileSdk 35
    defaultConfig {
        applicationId 'com.toshreds.webmtomp4'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release { minifyEnabled false }
        debug { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        jniLibs { useLegacyPackaging = true }
    }
}
dependencies {
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-min-gpl:7.1.6'
}
