name: Zork build and test
on:
  push:
    branches: [main]
    paths: ['zork/**', 'scripts/**', 'tests/**', 'sources.lock.json', '.github/workflows/zork.yml', 'LICENSE']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: zork-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the self-contained offline edition
        run: python scripts/standalone.py
      - name: Original-engine regression tests
        run: |
          mkdir -p test-results
          git rev-parse HEAD > test-results/source-commit.txt
          node --test tests/engine.cjs | tee test-results/engine-tests.txt
      - name: Install browser testing dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Test desktop, phones, landscape, persistence and portable saves
        run: python tests/browser.py
      - name: Keep the committed offline edition in sync after passing tests
        run: |
          git add zork.html
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Rebuild tested standalone Zork from canonical source'
            git push origin HEAD:main
          fi
      - name: Package the playable site
        run: |
          mkdir -p dist
          cp -r zork dist/
          cp zork.html index.html .nojekyll README.md LICENSE dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zork-browser-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: zork-playable
          path: dist/
          include-hidden-files: true
          retention-days: 30
