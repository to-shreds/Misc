name: Build WebM to MP4 APK

on:
  workflow_dispatch:
  push:
    paths:
      - "WebmToMp4/**"
      - ".github/workflows/webm-to-mp4.yml"

permissions:
  contents: write

concurrency:
  group: build-webm-mp4-retest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Test conversion options
        run: |
          mkdir -p "$RUNNER_TEMP/webm-unit"
          javac -d "$RUNNER_TEMP/webm-unit" WebmToMp4/app/src/main/java/com/toshreds/webmtomp4/CommandBuilder.java WebmToMp4/tests/CommandBuilderTest.java
          java -cp "$RUNNER_TEMP/webm-unit" com.toshreds.webmtomp4.CommandBuilderTest

      - name: Build signed, installable APK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          gradle -p WebmToMp4 :app:assembleDebug --stacktrace
          mkdir -p "$RUNNER_TEMP/webm-apk"
          cp WebmToMp4/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/webm-apk/WebmToMp4.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$RUNNER_TEMP/webm-apk/WebmToMp4.apk"
          unzip -l "$RUNNER_TEMP/webm-apk/WebmToMp4.apk" | grep -E 'lib.*/(libffmpegkit|libavcodec|libavformat).*so' | head

      - name: Verify 16 KB alignment of ARM64 native libraries
        run: |
          unzip -p "$RUNNER_TEMP/webm-apk/WebmToMp4.apk" lib/arm64-v8a/libswresample.so > "$RUNNER_TEMP/libswresample.so"
          readelf -lW "$RUNNER_TEMP/libswresample.so" | awk '$1=="LOAD" { n++; if ($NF != "0x4000") bad++ } END { if (n==0 || bad>0) exit 1; print "ARM64 native LOAD segments are 16 KB aligned" }'

      - name: Check foreground-service architecture
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          base = pathlib.Path("WebmToMp4/app/src/main")
          doc = ET.parse(base / "AndroidManifest.xml").getroot()
          ns = "{http://schemas.android.com/apk/res/android}"
          services = doc.findall("./application/service")
          assert len(services) == 1
          svc = services[0]
          assert svc.attrib[ns+"exported"] == "false"
          assert svc.attrib[ns+"stopWithTask"] == "false"
          assert "mediaProcessing" in svc.attrib[ns+"foregroundServiceType"]
          permissions = {e.attrib[ns+"name"] for e in doc.findall("./uses-permission")}
          for name in ("FOREGROUND_SERVICE", "FOREGROUND_SERVICE_MEDIA_PROCESSING", "FOREGROUND_SERVICE_DATA_SYNC", "WAKE_LOCK", "POST_NOTIFICATIONS"):
              assert "android.permission."+name in permissions
          activity = (base / "java/com/toshreds/webmtomp4/MainActivity.java").read_text()
          service = (base / "java/com/toshreds/webmtomp4/ConversionService.java").read_text()
          assert "startForegroundService(work)" in activity
          assert "FFmpegKit.executeWithArgumentsAsync" not in activity
          assert "FFmpegKit.executeWithArgumentsAsync" in service
          assert "PowerManager.PARTIAL_WAKE_LOCK" in service
          assert "ACTION_CANCEL" in service and "onTimeout" in service
          print("Foreground conversion service wiring passed.")
          PY

      - name: Compile Android instrumentation tests
        run: gradle -p WebmToMp4 :app:assembleAndroidTest --stacktrace

      - name: Install and boot Android 15 emulator
        if: github.event_name == 'workflow_dispatch'
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          timeout 360 sdkmanager "platform-tools" "emulator" "platforms;android-35" \
            "system-images;android-35;google_apis;x86_64"
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          printf 'no\n' | avdmanager create avd --force --name webm-smoke \
            --package "system-images;android-35;google_apis;x86_64" --device "pixel_6"
          nohup "$ANDROID_SDK_ROOT/emulator/emulator" -avd webm-smoke \
            -no-window -no-audio -no-snapshot -no-boot-anim \
            -gpu swiftshader_indirect >"$RUNNER_TEMP/webm-emulator.log" 2>&1 &
          timeout 120 adb wait-for-device
          timeout 420 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 5; done'
          adb shell settings put global window_animation_scale 0

      - name: Convert actual WebM to lossless and CRF MP4 on Android
        if: github.event_name == 'workflow_dispatch'
        run: |
          adb install -r WebmToMp4/app/build/outputs/apk/debug/app-debug.apk
          adb install -r WebmToMp4/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          timeout 240 adb shell am instrument -w \
            com.toshreds.webmtomp4.test/com.toshreds.webmtomp4.ConversionSmokeRunner \
            | tee "$RUNNER_TEMP/webm-instrumentation.log"
          grep -F 'result=PASS' "$RUNNER_TEMP/webm-instrumentation.log"
          grep -F 'INSTRUMENTATION_CODE: -1' "$RUNNER_TEMP/webm-instrumentation.log"

      - name: Capture Android errors on failure
        if: failure() && github.event_name == 'workflow_dispatch'
        timeout-minutes: 1
        run: |
          tail -n 100 "$RUNNER_TEMP/webm-emulator.log" 2>/dev/null || true
          timeout 15 adb logcat -d -t 1500 2>/dev/null | grep -A 12 -B 5 -E "WebMToMP4|AndroidRuntime|FFmpegKit|ffmpeg-kit|libavcodec|libavformat|FATAL EXCEPTION" || true

      - uses: actions/upload-artifact@v4
        with:
          name: WebmToMp4-APK
          path: ${{ runner.temp }}/webm-apk/WebmToMp4.apk
          retention-days: 30

      - name: Publish public APK download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view webm-to-mp4-v1 >/dev/null 2>&1 || \
            gh release create webm-to-mp4-v1 \
              --title "WebM to MP4 for Android" \
              --notes "Offline converter, lossless H.264/ALAC by default, or adjustable H.264 CRF with AAC."
          gh release upload webm-to-mp4-v1 "$RUNNER_TEMP/webm-apk/WebmToMp4.apk" --clobber
