name: Zork vendor snapshot
on:
  push:
    paths: ['.github/workflows/zork-vendor.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch original game and interpreter source
        run: |
          mkdir -p inputs
          git clone --depth 1 https://github.com/historicalsource/zork1.git inputs/zork-source
          git clone --depth 1 https://github.com/curiousdannii/ifvms.js.git inputs/ifvms
          git -C inputs/zork-source rev-parse HEAD > inputs/zork-revision.txt
          git -C inputs/ifvms rev-parse HEAD > inputs/ifvms-revision.txt
          test "$(git -C inputs/zork-source hash-object COMPILED/zork1.z3)" = e447402828441d44375b2b067befcd0ef02b37b7
          cp inputs/zork-source/COMPILED/zork1.z3 inputs/zork1.z3
          npx --yes esbuild@0.25.0 inputs/ifvms/src/zvm.js --bundle --format=iife --global-name=ZVM --outfile=inputs/zvm.js
          rm -rf inputs/zork-source/.git inputs/ifvms/.git
      - uses: actions/upload-artifact@v4
        with:
          name: zork-development-inputs
          path: inputs/
          retention-days: 7
