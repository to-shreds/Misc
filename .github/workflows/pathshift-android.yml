name: PathShift Android APK
on:
  push:
    paths:
      - 'PathShift/**'
      - '.github/workflows/pathshift-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Test metadata and rename engine
        working-directory: PathShift
        run: bash tests/run-tests.sh
      - name: Build installable signed APK
        working-directory: PathShift
        env:
          PATHSHIFT_KEYSTORE: ${{ runner.temp }}/pathshift-release/signing.jks
          PATHSHIFT_KEYPASS_FILE: ${{ runner.temp }}/pathshift-release/password.txt
        run: bash build.sh
      - name: Validate APK contents
        working-directory: PathShift
        run: |
          aapt2_path="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2"
          "$aapt2_path" dump badging dist/PathShift-0.1.4.apk | head -n 20
          test -s dist/PathShift-0.1.4.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PathShift-APK-v0.1.4
          path: |
            PathShift/dist/PathShift-0.1.4.apk
            PathShift/dist/PathShift-0.1.4.apk.sha256
          retention-days: 90

  android-emulator-smoke:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PathShift-APK-v0.1.4
          path: PathShift/dist
      - name: Enable emulator hardware acceleration
        run: if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Launch app and exercise staged regex rename on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 3072M
          disk-size: 4096M
          script: python3 PathShift/tests/android_smoke.py
      - name: Upload device screenshots and verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PathShift-android-device-proof
          path: PathShift/device-proof/
          if-no-files-found: warn
          retention-days: 30
