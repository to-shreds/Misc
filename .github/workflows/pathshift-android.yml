name: PathShift Android APK
on:
  push:
    paths:
      - 'PathShift/**'
      - '.github/workflows/pathshift-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Test metadata and rename engine
        working-directory: PathShift
        run: bash tests/run-tests.sh
      - name: Build installable signed APK
        working-directory: PathShift
        env:
          PATHSHIFT_KEYSTORE: ${{ runner.temp }}/pathshift-release/signing.jks
          PATHSHIFT_KEYPASS_FILE: ${{ runner.temp }}/pathshift-release/password.txt
        run: bash build.sh
      - name: Validate APK contents
        working-directory: PathShift
        run: |
          aapt2_path="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2"
          "$aapt2_path" dump badging dist/PathShift-0.1.0.apk | head -n 20
          test -s dist/PathShift-0.1.0.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PathShift-APK-v0.1.0
          path: |
            PathShift/dist/PathShift-0.1.0.apk
            PathShift/dist/PathShift-0.1.0.apk.sha256
          retention-days: 90
      - name: Preserve signing identity for future builds
        uses: actions/upload-artifact@v4
        with:
          name: PathShift-signing-backup-KEEP-PRIVATE
          path: ${{ runner.temp }}/pathshift-release/
          retention-days: 90
