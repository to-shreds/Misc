name: Build Folder Slideshow APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
        working-directory: FolderSlideshow
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FolderSlideshow-APK
          path: FolderSlideshow/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
