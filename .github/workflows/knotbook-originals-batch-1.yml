name: Knotbook originals batch 1
on:
  push:
    paths:
      - '.github/workflows/knotbook-originals-batch-1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original-batch:
    if: github.ref == 'refs/heads/knots-originals-batch-1'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply inspected one-time source integration
        run: |
          python knots/tools/install_originals_v1.py
          git restore .github/workflows/knotbook.yml
      - name: Clarify the leader roles and avoid repainting held frames
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('knots/originals.js');s=p.read_text()
          if 'Gold: standing / Blue: tag' not in s:
              s=s.replace("if(!compact){const a=ropes[0].p[0]", "if(!compact&&!def.leader){const a=ropes[0].p[0]")
              s=s.replace("return s+'</svg>';}", "if(!compact&&def.leader)s+='<text x=\"24\" y=\"197\" fill=\"'+INK+'\" font-size=\"12\" font-family=\"system-ui\">Gold: standing / Blue: tag</text><text x=\"310\" y=\"429\" fill=\"'+INK+'\" font-size=\"12\" font-family=\"system-ui\">Gold: tag / Blue: leader</text>';\nreturn s+'</svg>';}")
              s=s.replace("$('oa-stage').innerHTML=picture(k.id,a.stage,a.progress,a.mirror);", "const paintKey=a.stage+':'+a.progress.toFixed(3)+':'+a.mirror;if(a.paintKey!==paintKey){$('oa-stage').innerHTML=picture(k.id,a.stage,a.progress,a.mirror);a.paintKey=paintKey;}")
              p.write_text(s)
          p=Path('knots/tools/originals_test.py');s=p.read_text()
          if 'Surgeon join labels' not in s:
              s=s.replace("        svg=page.locator('#oa-stage').inner_html();", "        if id=='surgeons-join':check('Gold: standing / Blue: tag' in page.locator('#oa-stage').inner_text(),'Surgeon join labels the opposite-direction line roles')\n        svg=page.locator('#oa-stage').inner_html();")
              p.write_text(s)
          PY
      - name: Build and syntax-check
        run: |
          python knots/tools/build.py
          python knots/tools/build.py --check
          node --check knots/app.js
          node --check knots/originals.js
      - run: pip install playwright
      - name: All 100 tutorials and existing functionality
        run: python knots/tools/browser_test.py --online-pictures
      - name: All 20 original animations and their controls
        run: python knots/tools/originals_test.py
      - name: Preserve the tested source and generated page on staging
        run: |
          git config user.name 'Knotbook build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add knots.html knots/app.js knots/template.html knots/originals.js knots/tools/build.py knots/tools/browser_test.py knots/tools/originals_test.py
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate and verify first 20 original Knotbook animations'
            git push origin HEAD:knots-originals-batch-1
          fi
          git rev-parse HEAD > knots/proof/tested-commit.txt
          sha256sum knots.html knots/originals.js knots/originals.css knots/app.js knots/template.html > knots/proof/sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knotbook-originals-batch-1-proof
          path: |
            knots/
            knots.html
            index.html
          retention-days: 7
