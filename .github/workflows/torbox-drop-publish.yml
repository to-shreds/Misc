name: Verify live TorBox Drop
on:
  push:
    branches: [publish/torbox-drop-youtube-2.1.4]
permissions:
  contents: write
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Stage matching version labels without changing client behavior
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          for name in ('index.html','TorBox-Drop.html'):
            p=Path('TorboxDrop')/name
            text=p.read_text().replace('TorBox Drop web 2.1.3','TorBox Drop web 2.1.4').replace('>Download the Android APK<','>Download stable Android 2.1.1<').replace('>Android APK<','>Android stable 2.1.1<')
            p.write_text(text)
            assert hashlib.sha256(p.read_bytes()).hexdigest()=='e3711ff8db8c1e256d3571dcf30818caa323d5f83355316d7855eac21b524e86'
          PY
          git add TorboxDrop/index.html TorboxDrop/TorBox-Drop.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Keep web 2.1.4 and the retained stable Android link clearly labeled'
          git push origin HEAD:refs/heads/publish/torbox-drop-youtube-2.1.4
      - name: Verify both published pages against the tested source
        run: |
          set -euo pipefail
          mkdir evidence
          for page in index.html TorBox-Drop.html; do
            ok=0
            for attempt in $(seq 1 24); do
              if curl --fail --location --silent --show-error "https://to-shreds.github.io/Misc/TorboxDrop/$page" -o "evidence/$page" && echo "e3711ff8db8c1e256d3571dcf30818caa323d5f83355316d7855eac21b524e86  evidence/$page" | sha256sum -c -; then ok=1; break; fi
              sleep 10
            done
            test "$ok" = 1
          done
          sha256sum evidence/*.html > evidence/SHA256SUMS.txt
      - run: npm install --no-save --package-lock=false playwright@1.61.1
      - run: npx playwright install --with-deps chromium
      - name: Open the published client in a real mobile browser
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          import fs from 'node:fs/promises';
          const browser = await chromium.launch();
          const page = await browser.newPage({viewport:{width:390,height:844}});
          const errors = []; page.on('pageerror', e => errors.push(String(e)));
          await page.goto('https://to-shreds.github.io/Misc/TorboxDrop/', {waitUntil:'networkidle'});
          assert.match(await page.locator('body').innerText(), /2\.1\.4/);
          assert.equal(await page.locator('input[type=password]').isEnabled(), true);
          assert.equal(await page.locator('meta[name=torbox-api]').getAttribute('content'), 'https://torbox-drop-api.onrender.com/api/');
          assert.deepEqual(errors, []);
          await page.screenshot({path:'evidence/live-login-mobile.png',fullPage:true});
          await fs.writeFile('evidence/live.json', JSON.stringify({url:page.url(),version:'2.1.4',passwordEnabled:true,jsErrors:errors,authenticatedTorBoxTest:false,checkedAt:new Date().toISOString()}, null, 2));
          await browser.close();
          JS
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: torbox-drop-live-2.1.4
          path: evidence/
