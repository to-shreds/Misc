name: WebM to MP4 Android runtime smoke

on:
  workflow_dispatch:
  push:
    paths:
      - "WebmToMp4/**"
      - ".github/workflows/webm-to-mp4-smoke.yml"

permissions:
  contents: read

jobs:
  android-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build application and instrumentation runner
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          gradle -p WebmToMp4 :app:assembleDebug :app:assembleAndroidTest --stacktrace

      - name: Verify background transcoding on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            adb install -r WebmToMp4/app/build/outputs/apk/debug/app-debug.apk
            adb install -r WebmToMp4/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.toshreds.webmtomp4.test/com.toshreds.webmtomp4.ConversionSmokeRunner | tee "$RUNNER_TEMP/webm-runtime.txt"
            grep -F 'result=PASS' "$RUNNER_TEMP/webm-runtime.txt"
            grep -F 'INSTRUMENTATION_CODE: -1' "$RUNNER_TEMP/webm-runtime.txt"

      - name: Capture device logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/webm-runtime-logs"
          cp "$RUNNER_TEMP/webm-runtime.txt" "$RUNNER_TEMP/webm-runtime-logs/" 2>/dev/null || true
          timeout 15 adb logcat -d -t 2000 > "$RUNNER_TEMP/webm-runtime-logs/logcat.txt" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webm-background-runtime-evidence
          path: /home/runner/work/_temp/webm-runtime-logs/
          if-no-files-found: ignore
          retention-days: 14
