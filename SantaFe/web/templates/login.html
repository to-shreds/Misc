<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c1721">
  <title>Santa Fe · Sign in</title>
  <style nonce="{{ nonce }}">
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #f4f7fa; background: #0c1721; }
    * { box-sizing: border-box; }
    body { min-height: 100svh; margin: 0; padding: 28px 20px; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 0, #173641 0, #0c1721 68%); }
    main { width: min(100%, 410px); }
    .mark { width: 58px; height: 58px; display: grid; place-items: center; border-radius: 18px; background: #143a40; color: #b5f0de; margin-bottom: 24px; }
    .mark svg { width: 36px; height: 36px; }
    .eyebrow { margin: 0 0 9px; color: #a4c1c4; letter-spacing: .13em; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(35px, 8vw, 43px); letter-spacing: -.045em; font-weight: 650; line-height: 1.15; }
    .intro { margin: 15px 0 29px; color: #b2c0ca; font-size: 15px; line-height: 1.55; max-width: 32ch; }
    form { border: 1px solid #2b3d49; border-radius: 22px; padding: 24px; background: #14232f; box-shadow: 0 20px 70px #0003; }
    label { display: block; font-size: 13px; font-weight: 650; margin-bottom: 10px; }
    input { display: block; width: 100%; border-radius: 12px; border: 1px solid #415360; padding: 15px; color: #f4f7fa; background: #0e1c27; font: inherit; font-size: 17px; outline: none; }
    input:focus { border-color: #a2e7d3; box-shadow: 0 0 0 3px #a2e7d31a; }
    button { width: 100%; border: 0; border-radius: 12px; background: #b5f0de; color: #10242c; padding: 15px; margin-top: 18px; cursor: pointer; font: inherit; font-size: 15px; font-weight: 750; min-height: 50px; }
    button:hover { background: #cdf8eb; }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    .error { padding: 12px 14px; margin: 0 0 17px; border-radius: 10px; border: 1px solid #785350; background: #3d2728; color: #ffc8c1; font-size: 14px; line-height: 1.45; }
    .footnote { color: #7f949f; font-size: 12px; line-height: 1.55; text-align: center; margin: 21px 12px 0; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 40 40" fill="none"><path d="M7 18 11 10h18l4 8M7 18h26v12H7V18Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M11 24h4m10 0h4M10 30v3m20-3v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>
    <p class="eyebrow">Emergency access</p>
    <h1>Santa Fe</h1>
    <p class="intro">Enter your website password to open the car controls.</p>
    <form action="/login" method="post">
      <input type="hidden" name="csrf" value="{{ login_csrf }}">
      {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
      <label for="site-password">Website password</label>
      <input id="site-password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">Open controls <span aria-hidden="true">↗</span></button>
    </form>
    <p class="footnote">Access to your vehicle stays behind this sign-in.</p>
  </main>
</body>
</html>
